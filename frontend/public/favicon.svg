<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Royal Blue Gradient for V -->
    <linearGradient id="fav-v-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#3B82F6" />
      <stop offset="45%" stopColor="#1D4ED8" />
      <stop offset="100%" stopColor="#0E1D5B" />
    </linearGradient>

    <!-- Metallic Gold Gradient for R -->
    <linearGradient id="fav-r-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FCD34D" />
      <stop offset="30%" stopColor="#F59E0B" />
      <stop offset="75%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#92400E" />
    </linearGradient>

    <!-- Dynamic Swoosh Gradient -->
    <linearGradient id="fav-swoosh" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#1D4ED8" stopOpacity="0.4" />
      <stop offset="35%" stopColor="#1D4ED8" />
      <stop offset="75%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#F59E0B" />
    </linearGradient>

    <!-- Drop Shadow for Letters -->
    <filter id="fav-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" floodColor="#060E27" floodOpacity="0.18" />
    </filter>
  </defs>

  <!-- Crisp High-Contrast White Squircle for Immediate Legibility Across Dark & Light Browser Tabs -->
  <rect width="160" height="160" rx="34" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5" />

  <!-- Monogram & Pixel Clusters Centered -->
  <g transform="translate(0, 21)" filter="url(#fav-shadow)">
    <!-- Monogram V (Royal Blue Gradient with dynamic geometric slant) -->
    <path
      d="M 12 18 L 32 18 L 48 76 L 62 18 L 80 18 L 56 94 L 40 94 Z"
      fill="url(#fav-v-blue)"
    />

    <!-- Monogram R (Rich Gold Metallic Gradient) -->
    <path
      d="M 68 18 L 102 18 C 118 18 128 26 128 40 C 128 50 122 58 112 62 L 132 94 L 112 94 L 94 65 L 86 65 L 86 94 L 68 94 Z M 86 34 L 86 50 L 100 50 C 107 50 111 46 111 42 C 111 37 107 34 100 34 Z"
      fill="url(#fav-r-gold)"
    />

    <!-- Pixel-Mosaic Clusters (Gold) -->
    <rect x="132" y="14" width="8" height="8" rx="1.5" fill="#F59E0B" />
    <rect x="144" y="8" width="6" height="6" rx="1" fill="#D97706" />
    <rect x="135" y="26" width="7" height="7" rx="1.5" fill="#FBBF24" />
    <rect x="146" y="20" width="5" height="5" rx="1" fill="#FCD34D" />
    <rect x="154" y="14" width="4" height="4" rx="0.8" fill="#F59E0B" />

    <!-- Pixel-Mosaic Clusters (Blue) -->
    <rect x="126" y="6" width="7" height="7" rx="1.5" fill="#2563EB" />
    <rect x="116" y="4" width="6" height="6" rx="1" fill="#1D4ED8" />
    <rect x="145" y="30" width="5" height="5" rx="1" fill="#3B82F6" />

    <!-- Dynamic Curved Swoosh Underneath -->
    <path
      d="M 6 102 C 30 116 80 118 136 98 C 146 94 152 90 156 86 C 148 93 130 106 88 108 C 50 110 24 104 6 102 Z"
      fill="url(#fav-swoosh)"
    />
    
    <!-- Accent Swoosh Highlight Spark -->
    <circle cx="148" cy="91" r="3" fill="#F59E0B" />
  </g>
</svg>
